<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlueCurl Surf Lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      .hud {
        position: fixed; left: 8px; top: 8px; padding: 6px 8px; pointer-events: none;
        font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; color: #e8e8e8;
        background: rgba(0, 0, 0, 0.45); border-radius: 4px; white-space: pre;
      }
      .hud.hidden { display: none; }
      #scope { position: fixed; left: 8px; bottom: 8px; pointer-events: none; }
      body.capture .hud, body.capture .lil-gui, body.capture #scope { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <canvas id="scope" width="420" height="190"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
