<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wave Parity</title>
  <style>body { margin: 0; background: #0f1720; color: #cfe; font: 13px Consolas, monospace; } pre { padding: 12px; }</style>
</head>
<body>
  <pre id="out">GPU vs JS wave parity — run window.__runParity() (or open with ?run=1)</pre>
  <script type="module">
    import { runParity } from './wave-parity.js';
    if (new URLSearchParams(location.search).has('run')) {
      runParity().then((s) => { document.getElementById('out').textContent = JSON.stringify(s, null, 2); });
    }
  </script>
</body>
</html>
